name: Build PSP EBOOT

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure build tools
        run: apk add --no-cache make || true

      - name: Build EBOOT.PBP
        run: make -C psp/src

      - name: Package game folder
        run: |
          mkdir -p OPSPEZZATO
          cp psp/src/EBOOT.PBP OPSPEZZATO/
          cp -r psp/assets OPSPEZZATO/assets

      - name: Upload OPSPEZZATO
        uses: actions/upload-artifact@v4
        with:
          name: OPSPEZZATO
          path: OPSPEZZATO
          if-no-files-found: warn
